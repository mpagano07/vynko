version: 2

# Los archivos de test y fixtures usan cadenas que parecen credenciales
# (password, token) pero son valores inventados para las aserciones. El
# detector las marca como secretos y cada corrida ensucia el reporte.
# Acá se bajan los falsos positivos de una forma acotada: solo paths de test.
#
# OJO: esto NO desactiva el escaneo de src/ ni de scripts/. Si un secreto real
# se cuela en la app, sigue apareciendo.
#
# OJO 2: este archivo solo lo lee ggshield (el CLI). El dashboard de
# GitGuardian ignora este archivo por completo y usa sus propias
# "Filepath exclusions" en Settings -> Secrets detection.

secret:
  ignored_paths:
    - 'src/test/**'
    - 'e2e/**'
    - '**/*.test.*'
    - '**/*.spec.*'
    # Documenta nombres de variables, no valores
    - '.env.example'
