name: Backup de produccion

# Backup diario con verificacion + almacenamiento offsite.
#
# Corre el backup (roles + schema + data) mediante scripts/backup-db.ps1, lo
# cifra con age y lo publica como GitHub Release para no depender del backup
# pago de Supabase ni de la retencion de 30 dias de los artifacts.
#
# Retencion (rotacion GFS): cada corrida borra los Releases que ya no entran en
# la ventana. Se conservan ~14 diarios + 8 semanales + 12 mensuales (~34 como
# maximo), no todo el historico. No se guardan solo los ultimos: los snapshots
# viejos sirven para detectar corrupcion silenciosa o ransomware, donde el
# backup mas reciente ya esta contaminado. Los limites estan en el paso
# "Rotar backups viejos" (KEEP_*), editables sin tocar la logica.
#
# Opt-in: si no hay secret PROD_DB_URL el workflow se saltea y no falla el CI
# (GitHub no permite `secrets` adentro de un `if:` a nivel de job, por eso el
# chequeo pasa por un paso intermedio con output). Si falta AGE_RECIPIENT solo
# se omite el cifrado + Release, no el backup.
#
# IMPORTANTE: el repo es PUBLICO. Los dumps contienen datos de clientes, por eso
# NO se suben en claro: el unico destino es el Release cifrado con age (la clave
# privada vive fuera del repo). Nunca agregar un upload-artifact con los .sql.

on:
  schedule:
    # 03:30 UTC = 00:30 ART: ventana de menor trafico.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      prune_dry_run:
        description: 'Solo listar los Releases que se borrarian (no borrar nada)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backup:
    # Runner fijo: ubuntu-latest esta migrando a Ubuntu 26 y este job depende de
    # pwsh + paquetes de apt (postgresql-client, age). Actualizar a proposito.
    runs-on: ubuntu-24.04

    steps:
      - name: Check backup secrets
        id: backup-secret
        run: |
          if [ -n "$PROD_DB_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$AGE_RECIPIENT" ]; then
            echo "has_age=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_age=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}

      - name: Checkout
        if: steps.backup-secret.outputs.configured == 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: steps.backup-secret.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Version PINEADA a proposito. `npm install -g supabase` instalo la 3.0.0
      # el 2026-11-02 y rompio el backup: en v3 `db query` contra una base remota
      # exige `--yes` o `--read-only` (HostedMutationConsentRequiredError) y dejo
      # de aceptar `--db-url`, que es lo que usa backup-db.ps1 para los conteos
      # del manifiesto. Migrar el script a `--remote=<url>` + `--read-only` es
      # tarea aparte; hasta entonces, no despinear (v2.stable = 2.122.1).
      - name: Install supabase CLI
        if: steps.backup-secret.outputs.configured == 'true'
        run: |
          npm install -g supabase@2.122.1
          supabase --version

      # psql (solo para el restore test) ya viene en la imagen ubuntu-24.04.
      # age no: va por el binario estatico oficial + SHA256 para no depender del
      # mirror de apt. El 2026-11-11 `apt-get update` fallo resolviendo
      # azure.archive.ubuntu.com y se llevo puesto el job entero.
      - name: Install age and check psql
        if: steps.backup-secret.outputs.configured == 'true'
        env:
          AGE_VERSION: '1.3.2'
          AGE_SHA256: 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10'
        run: |
          set -euo pipefail
          url="https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o /tmp/age.tgz "$url"
          echo "${AGE_SHA256}  /tmp/age.tgz" | sha256sum -c -
          tar -xzf /tmp/age.tgz -C /tmp
          sudo install -m 0755 /tmp/age/age /usr/local/bin/age
          age --version

          # Si la imagen dejara de traer psql, se instala con reintentos.
          if command -v psql >/dev/null 2>&1; then
            psql --version
          else
            for i in 1 2 3; do
              if sudo apt-get update -o Acquire::Retries=5 \
                 && sudo apt-get install -y postgresql-client; then
                break
              fi
              echo "apt fallo (intento $i); reintentando en 15s..."
              sleep 15
            done
            command -v psql
          fi

      # El script lee .env.db (ignorado por git), igual que en local.
      - name: Write .env.db
        if: steps.backup-secret.outputs.configured == 'true'
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          # Con DEV_DB_URL ademas se verifica el RESTORE en una base scratch:
          # sin ella solo se valida la estructura de los dumps.
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
        run: |
          {
            echo "PROD_DB_URL=$PROD_DB_URL"
            if [ -n "$DEV_DB_URL" ]; then echo "DEV_DB_URL=$DEV_DB_URL"; fi
          } > .env.db

      - name: Backup con verificacion
        if: steps.backup-secret.outputs.configured == 'true'
        shell: pwsh
        run: ./scripts/backup-db.ps1

      - name: Encrypt and package
        id: encrypt
        if: steps.backup-secret.outputs.configured == 'true' && steps.backup-secret.outputs.has_age == 'true'
        env:
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          ts="$(date -u +%Y%m%d-%H%M%S)"
          echo "ts=$ts" >> "$GITHUB_OUTPUT"
          mkdir -p release
          tar -C scripts/dumps -czf "release/vynko-backup-$ts.tar.gz" .
          age -r "$AGE_RECIPIENT" -o "release/vynko-backup-$ts.tar.gz.age" "release/vynko-backup-$ts.tar.gz"
          rm -f "release/vynko-backup-$ts.tar.gz"
          sha256sum "release/vynko-backup-$ts.tar.gz.age" > "release/vynko-backup-$ts.tar.gz.age.sha256"
          sha256sum --check "release/vynko-backup-$ts.tar.gz.age.sha256"

      - name: Publish encrypted backup as GitHub Release
        if: steps.backup-secret.outputs.configured == 'true' && steps.backup-secret.outputs.has_age == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ts="${{ steps.encrypt.outputs.ts }}"
          gh release create "backup-$ts" \
            --title "Backup $ts" \
            --notes "Backup automatico cifrado con age. Contenido: roles.sql, schema.sql, data.sql y manifest.json (tar.gz)." \
            release/*.age release/*.age.sha256

      # Rotacion GFS: sin esto los Releases se acumulan para siempre.
      # Se conservan los de la ventana diaria completos, uno por semana ISO y
      # uno por mes calendario; el resto (release + tag) se borra. Los limites
      # son por edad en dias, asi que la ventana "rueda" sola en cada corrida.
      - name: Rotar backups viejos
        if: steps.backup-secret.outputs.configured == 'true' && steps.backup-secret.outputs.has_age == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.prune_dry_run }}
          KEEP_DAILY_DAYS: '14'    # todos los backups de los ultimos 14 dias
          KEEP_WEEKLY_DAYS: '70'   # hasta 70 dias: 1 por semana ISO (~8)
          KEEP_MONTHLY_DAYS: '365' # hasta 365 dias: 1 por mes (~12)
          KEEP_MIN: '7'            # piso de seguridad: nunca borrar los 7 mas nuevos
        run: |
          set -euo pipefail
          now="$(date -u +%s)"

          # `gh` devuelve los Releases mas nuevos primero. Solo se tocan tags con
          # el formato exacto backup-YYYYMMDD-HHMMSS: cualquier otro Release del
          # repo queda intacto.
          releases="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt)"

          plan="$(jq -r \
            --argjson now "$now" \
            --argjson daily "$KEEP_DAILY_DAYS" \
            --argjson weekly "$KEEP_WEEKLY_DAYS" \
            --argjson monthly "$KEEP_MONTHLY_DAYS" \
            --argjson min "$KEEP_MIN" '
              (sort_by(.createdAt) | reverse
               | map(select(.tagName | test("^backup-[0-9]{8}-[0-9]{6}$")))) as $all
              | ($all | to_entries | map(
                    .key as $idx
                    | .value as $r
                    | ($r.createdAt | fromdateiso8601) as $t
                    | {
                        tag: $r.tagName,
                        idx: $idx,
                        age: (($now - $t) / 86400 | floor),
                        week: ($t | gmtime | strftime("%G-W%V")),
                        month: ($t | gmtime | strftime("%Y-%m"))
                      }
                  )) as $rows
              | (reduce $rows[] as $r ({keep: [], seen: {}};
                    if $r.idx < $min or $r.age < $daily then
                      .keep += [$r.tag]
                    elif $r.age < $weekly then
                      ("w:" + $r.week) as $b
                      | if .seen[$b] then . else .seen[$b] = true | .keep += [$r.tag] end
                    elif $r.age < $monthly then
                      ("m:" + $r.month) as $b
                      | if .seen[$b] then . else .seen[$b] = true | .keep += [$r.tag] end
                    else . end
                ).keep) as $keep
              | $all[]
              | .tagName as $t
              | (if ($keep | index($t)) then "KEEP" else "DELETE" end) + "\t" + $t
            ' <<< "$releases")"

          kept=0
          deleted=0
          while IFS=$'\t' read -r action tag; do
            if [ -z "${tag:-}" ]; then continue; fi
            if [ "$action" = "KEEP" ]; then
              kept=$((kept + 1))
              continue
            fi
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "dry-run: se borraria $tag"
            else
              echo "Borrando Release viejo: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
            deleted=$((deleted + 1))
          done <<< "$plan"

          echo "Retencion: $kept conservados, $deleted $( [ "${DRY_RUN:-false}" = "true" ] && echo "a borrar (dry-run)" || echo "borrados" )."
